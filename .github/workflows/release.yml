name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Semantic Release & Publish to PyPI
    runs-on: ubuntu-latest
    concurrency: release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          
      - name: Python Semantic Release
        id: semantic-release
        uses: python-semantic-release/python-semantic-release@v9.8.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push tag to remote
        if: steps.semantic-release.outputs.released == 'true'
        run: git push origin ${{ steps.semantic-release.outputs.tag }}
        
      - name: Create GitHub Release
        if: steps.semantic-release.outputs.released == 'true'
        run: gh release create ${{ steps.semantic-release.outputs.tag }} --title ${{ steps.semantic-release.outputs.tag }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Publish to PyPI
        if: steps.semantic-release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
