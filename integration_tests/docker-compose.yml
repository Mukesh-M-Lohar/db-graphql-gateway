version: "3.9"

services:
  postgres:
    image: postgres:16
    command: postgres -c shared_preload_libraries=pg_stat_statements
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: sgql_test
      POSTGRES_PASSWORD: sgql_password
      POSTGRES_DB: sgql_test_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgql_test -d sgql_test_db"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
