[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
]
build-backend = "hatchling.build"

[project]
name = "db-graphql-gateway"
description = "Automatically generate a secure, production-ready GraphQL API from a database connection."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mukesh M Lohar", email = "mukesh1lohar@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "strawberry-graphql>=0.200.0",
    "pyjwt[crypto]>=2.8.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "mcp>=1.0.0",
]
dynamic = [
    "version",
]

[project.license]
text = "MIT"

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.28.0",
]
fastapi = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
    "testcontainers[postgres]>=4.4.1",
]
sqlite = [
    "aiosqlite>=0.22.1",
]
mysql = [
    "asyncmy>=0.2.14",
]
mcp = [
    "mcp>=2.2.0",
    "httpx>=0.28.1",
]

[project.scripts]
sgql = "db_graphql_gateway.cli.main:cli"
sgql-mcp = "db_graphql_gateway.mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/forgedlohar/db-graphql-gateway"
Documentation = "https://forgedlohar.github.io/db-graphql-gateway/"
Repository = "https://github.com/forgedlohar/db-graphql-gateway.git"
Issues = "https://github.com/forgedlohar/db-graphql-gateway/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "D419",
]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "testcontainers.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[tool.semantic_release]
version_toml = []
branch = "main"
upload_to_pypi = false
upload_to_release = false
build_command = "SETUPTOOLS_SCM_PRETEND_VERSION={version} pip install uv && uv build"
commit_version_number = false
push = false
vcs_release = false
commit = false
version_variables = []

[tool.hatch.version]
source = "vcs"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "asyncmy>=0.2.14",
    "asyncpg>=0.31.0",
    "faker>=40.39.0",
    "httpx>=0.28.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "pre-commit>=4.6.2",
    "pyjwt>=2.13.0",
    "pytest-benchmark>=5.3.0",
    "sqlalchemy>=2.0.52",
    "types-pyyaml>=6.0.12.20260815",
    "uvicorn>=0.54.0",
]
