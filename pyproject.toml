[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-graphql-gateway"
version = "0.1.0"
description = "Automatically generate a secure, production-ready GraphQL API from a database connection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Author", email = "author@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "strawberry-graphql",
    "sqlalchemy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy"
]
