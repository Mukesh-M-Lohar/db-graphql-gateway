site_name: db-graphql-gateway
site_description: A database-agnostic GraphQL gateway that pushes authorization and filtering down to SQL.
strict: false
site_url: https://github.com/Mukesh-M-Lohar/db-graphql-gateway

theme:
  name: 'material'
  palette:
    - media: '(prefers-color-scheme)'
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-auto
        name: 'Switch to light mode'
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-7
        name: 'Switch to dark mode'
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-4
        name: 'Switch to system preference'
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - announce.dismiss
    - navigation.tabs
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - toc.follow

repo_name: Mukesh-M-Lohar/db-graphql-gateway
repo_url: https://github.com/Mukesh-M-Lohar/db-graphql-gateway
edit_uri: edit/main/docs/

nav:
  - Get Started:
      - Welcome: index.md
      - Quickstart: quickstart.md
      - FAQ: FAQ.md
      - Changelog: CHANGELOG.md
  - Architecture & Spec:
      - Specification: SPEC.md
      - Architecture: ARCHITECTURE.md
  - Packaging & Plugins:
      - Packaging Plan: PACKAGING_PLAN.md
      - Adapter Contributing: CONTRIBUTING_ADAPTER.md
  - Security & Performance:
      - Security: SECURITY.md
      - Benchmarks: BENCHMARKS.md

markdown_extensions:
  - tables
  - toc:
      permalink: true
      title: Page contents
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.extra
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
