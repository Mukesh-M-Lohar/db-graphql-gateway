site_name: db-graphql-gateway
site_description: A database-agnostic GraphQL gateway that pushes authorization and filtering down to SQL.
strict: false
site_url: https://forgedlohar.github.io/db-graphql-gateway/

theme:
  name: 'material'
  palette:
    - media: '(prefers-color-scheme)'
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-auto
        name: 'Switch to light mode'
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-7
        name: 'Switch to dark mode'
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-4
        name: 'Switch to system preference'
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - announce.dismiss
    - navigation.tabs
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - toc.follow

repo_name: forgedlohar/db-graphql-gateway
repo_url: https://github.com/forgedlohar/db-graphql-gateway
edit_uri: edit/main/docs/

nav:
  - Overview:
      - Introduction: index.md
      - Comparison: comparison.md
      - Architecture: ARCHITECTURE.md

  - Getting Started:
      - Quickstart: quickstart.md
      - CLI Reference: cli.md
      - Testing: testing.md
      - FAQ: FAQ.md

  - Extending the Gateway:
      - Adapter Development: CONTRIBUTING_ADAPTER.md

  - Production:
      - Security: SECURITY.md
      - Performance & Benchmarks: BENCHMARKS.md

  - Reference:
      - Changelog: CHANGELOG.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: Page contents
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
