site_name: db-graphql-gateway
site_description: Secure, performant GraphQL APIs generated directly from your PostgreSQL database.
repo_url: https://github.com/Mukesh-M-Lohar/db-graphql-gateway
repo_name: Mukesh-M-Lohar/db-graphql-gateway

theme:
  name: material
  font:
    text: Inter
    code: Fira Code
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: slate
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/custom.css

nav:
  - Getting Started:
      - Home: index.md
      - Quickstart: quickstart.md
      - FAQ: FAQ.md
  - Core Concepts:
      - Architecture: ARCHITECTURE.md
      - Security: SECURITY.md
  - Reference:
      - Benchmarks: BENCHMARKS.md
      - Specifications: SPEC.md
      - Changelog: CHANGELOG.md

plugins:
  - search

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
